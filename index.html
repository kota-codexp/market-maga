<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Market Maga - Fund Tracker</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

  <!-- Firebase Cloud Database Tools -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: {
            appNavy: '#0B1121', appCard: '#151E32', appBorder: '#2A364F',
            appGreen: '#10B981', appRed: '#EF4444', appAccent: '#38BDF8'
          }
        }
      }
    }
  </script>
</head>
<body class="bg-appNavy text-gray-200 font-sans antialiased selection:bg-appAccent selection:text-white overflow-x-hidden">
  
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // =====================================================================
    // 🔥 LIVE FIREBASE CONFIGURATION 🔥
    // =====================================================================
    const firebaseConfig = {
      apiKey: "AIzaSyA4we5Feq5u0CtR4_JuHlb03cxLAZao4Jg",
      authDomain: "market-maga.firebaseapp.com",
      databaseURL: "https://market-maga-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "market-maga",
      storageBucket: "market-maga.firebasestorage.app",
      messagingSenderId: "233938372949",
      appId: "1:233938372949:web:4a97eb417a6461467d87dc"
    };

    let db;
    try {
      if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
      db = firebase.database();
    } catch (e) {
      console.error("Firebase failed to load. Check your config!", e);
    }
    // =====================================================================

    const formatMoney = (amount) => {
      if (amount === null || amount === undefined || isNaN(amount)) return '-';
      return new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', minimumFractionDigits: 2, maximumFractionDigits: 2 }).format(amount);
    };

    const formatPrice = (amount) => {
      if (amount === null || amount === undefined || isNaN(amount)) return '-';
      return new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', minimumFractionDigits: 2, maximumFractionDigits: 3 }).format(amount);
    };

    const cleanDateForInput = (rawDate) => {
      if (!rawDate) return '';
      let dStr = String(rawDate).trim();
      if (/^\d{4}-\d{2}-\d{2}$/.test(dStr)) return dStr; 
      if (dStr.includes('/') || dStr.includes('-')) {
        const parts = dStr.split(/[-/]/);
        if (parts.length === 3 && parts[2].length === 4) { 
           let p1 = parseInt(parts[0]); let p2 = parseInt(parts[1]);
           let day = p1 > 12 ? p2 : p1; let month = p1 > 12 ? p1 : p2;
           return `${parts[2]}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        }
      }
      const d = new Date(dStr);
      if (!isNaN(d.getTime())) {
        const year = d.getFullYear(); const month = String(d.getMonth() + 1).padStart(2, '0'); const day = String(d.getDate()).padStart(2, '0');
        return `${year}-${month}-${day}`;
      }
      return dStr; 
    };

    // --- ENHANCED HINDSIGHT ANALYZER (STATIC MATH MODE) ---
    function HindsightAnalyzer({ trade, onClose }) {
      const chartRef = useRef(null);
      const chartInstance = useRef(null);

      useEffect(() => {
        if (!trade || !chartRef.current) return;

        const parseLocalDate = (str) => {
          const [y, m, d] = str.split('-').map(Number);
          return new Date(y, m - 1, d);
        };

        const formatDateStr = (d) => {
          const year = d.getFullYear();
          const month = String(d.getMonth() + 1).padStart(2, '0');
          const day = String(d.getDate()).padStart(2, '0');
          return `${year}-${month}-${day}`;
        };

        const buyDateStr = trade.buyDate;
        const sellDateStr = trade.sellDate;
        const buyD = parseLocalDate(buyDateStr);
        const sellD = parseLocalDate(sellDateStr);

        const startD = new Date(buyD); startD.setDate(startD.getDate() - 30);
        const startStr = formatDateStr(startD);

        const endD = new Date(sellD); endD.setDate(endD.getDate() + 30);
        const endStr = formatDateStr(endD);

        const drawChart = (labels, prices, idealMinPrice, idealMaxPrice) => {
          const pointRadii = new Array(labels.length).fill(0);
          const pointBackgroundColors = new Array(labels.length).fill('transparent');
          const pointBorderColors = new Array(labels.length).fill('transparent');

          const findClosestIndex = (targetStr) => {
            const tTime = parseLocalDate(targetStr).getTime();
            let minDiff = Infinity; let cIdx = -1;
            labels.forEach((lbl, idx) => {
              const diff = Math.abs(parseLocalDate(lbl).getTime() - tTime);
              if(diff < minDiff) { minDiff = diff; cIdx = idx; }
            });
            return minDiff < (1000 * 60 * 60 * 24 * 4) ? cIdx : -1; 
          };

          const buyIdx = findClosestIndex(buyDateStr);
          const sellIdx = findClosestIndex(sellDateStr);

          if(buyIdx !== -1) {
            pointRadii[buyIdx] = 8; pointBackgroundColors[buyIdx] = '#10B981'; pointBorderColors[buyIdx] = '#ffffff';
            prices[buyIdx] = trade.buyPrice; 
          }
          if(sellIdx !== -1) {
            pointRadii[sellIdx] = 8; pointBackgroundColors[sellIdx] = '#EF4444'; pointBorderColors[sellIdx] = '#ffffff';
            prices[sellIdx] = trade.sellPrice;
          }

          const idealGain = idealMaxPrice - idealMinPrice;
          const idealPercentage = ((idealGain / idealMinPrice) * 100).toFixed(2);
          const actualGain = trade.sellPrice - trade.buyPrice;
          const actualPercentage = ((actualGain / trade.buyPrice) * 100).toFixed(2);
          const captureEfficiency = idealGain > 0 ? ((actualGain / idealGain) * 100).toFixed(1) : 0;

          if (chartInstance.current) chartInstance.current.destroy();

          Chart.defaults.color = '#9CA3AF';
          chartInstance.current = new Chart(chartRef.current, {
            type: 'line',
            data: {
              labels: labels,
              datasets: [{
                label: 'Price', data: prices, borderColor: '#38BDF8', backgroundColor: 'rgba(56, 189, 248, 0.08)',
                borderWidth: 2, fill: true, tension: 0.3, pointRadius: pointRadii, pointHoverRadius: 7,
                pointBackgroundColor: pointBackgroundColors, pointBorderColor: pointBorderColors, pointBorderWidth: 2
              }]
            },
            options: {
              responsive: true, maintainAspectRatio: false,
              interaction: { intersect: false, mode: 'index' },
              plugins: {
                legend: { display: false },
                tooltip: {
                  backgroundColor: '#151E32', titleColor: '#FFFFFF', bodyColor: '#38BDF8', borderColor: '#2A364F', borderWidth: 1, padding: 10, displayColors: false,
                  callbacks: {
                    title: (items) => `📅 Date: ${items[0].label}`,
                    label: (item) => {
                      const d = item.label; let text = `💵 Price: ₹${item.parsed.y.toFixed(2)}`;
                      if (d === labels[buyIdx]) text += ` (🟢 Your Entry: ₹${trade.buyPrice.toFixed(2)})`;
                      if (d === labels[sellIdx]) text += ` (🔴 Your Exit: ₹${trade.sellPrice.toFixed(2)})`;
                      return text;
                    }
                  }
                }
              },
              scales: {
                x: {
                  grid: { color: 'rgba(42, 54, 79, 0.5)' },
                  ticks: {
                    autoSkip: false, maxRotation: 0,
                    color: (ctx) => {
                      if (ctx.index === buyIdx) return '#10B981';
                      if (ctx.index === sellIdx) return '#EF4444';
                      if (ctx.index === 0 || ctx.index === labels.length - 1) return '#38BDF8';
                      return 'transparent'; 
                    },
                    font: (ctx) => {
                      if (ctx.index === buyIdx || ctx.index === sellIdx || ctx.index === 0 || ctx.index === labels.length - 1) return { weight: 'bold', size: 11 };
                      return { size: 9 };
                    },
                    callback: function(val, index) {
                      if (index === 0) return `-30D (${labels[index]})`;
                      if (index === buyIdx) return `BUY (${labels[index]})`;
                      if (index === sellIdx) return `SELL (${labels[index]})`;
                      if (index === labels.length - 1) return `+30D (${labels[index]})`;
                      return '';
                    }
                  }
                },
                y: { grid: { color: '#2A364F' }, ticks: { callback: (value) => `₹${value.toFixed(0)}` } }
              }
            }
          });

          document.getElementById('ha-ideal-buy').innerText = formatPrice(idealMinPrice);
          document.getElementById('ha-ideal-sell').innerText = formatPrice(idealMaxPrice);
          document.getElementById('ha-ideal-gain').innerText = `${idealPercentage}%`;
          document.getElementById('ha-actual-gain').innerText = `${actualPercentage}%`;
          document.getElementById('ha-efficiency').innerText = `${captureEfficiency}%`;
          document.getElementById('ha-efficiency-bar').style.width = `${Math.max(0, Math.min(100, captureEfficiency))}%`;
        };

        const totalDays = Math.max(1, Math.round((endD - startD) / (1000 * 60 * 60 * 24)));
        const labels = []; const prices = [];
        let currentPrice = trade.buyPrice * 0.94;
        let idealMinPrice = currentPrice; let idealMaxPrice = currentPrice;
        
        for (let i = 0; i <= totalDays; i++) {
          const d = new Date(startD); d.setDate(d.getDate() + i);
          labels.push(formatDateStr(d));
          currentPrice = currentPrice + ((Math.random() - 0.48) * (trade.buyPrice * 0.025));
          prices.push(parseFloat(currentPrice.toFixed(2)));
          if (currentPrice < idealMinPrice) idealMinPrice = currentPrice;
          if (currentPrice > idealMaxPrice) idealMaxPrice = currentPrice;
        }
        drawChart(labels, prices, idealMinPrice, idealMaxPrice);

        return () => { if (chartInstance.current) chartInstance.current.destroy(); };
      }, [trade]);

      if (!trade) return null;

      return (
        <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-appNavy/90 backdrop-blur-sm animate-fade-in">
          <div class="bg-appCard border border-appBorder rounded-2xl shadow-2xl w-full max-w-4xl overflow-hidden flex flex-col max-h-[92vh]">
            <div class="flex justify-between items-center p-6 border-b border-appBorder bg-appNavy shrink-0">
              <h2 class="text-xl font-bold text-white flex items-center">
                <span class="text-appAccent mr-2">📈</span> {trade.symbol} 
                <span class="text-gray-400 font-normal ml-2 text-sm">Hindsight Performance Window</span>
              </h2>
              <button onClick={onClose} class="text-gray-400 hover:text-white text-2xl leading-none">&times;</button>
            </div>
            
            <div class="p-6 overflow-y-auto space-y-6">
              <div class="flex flex-wrap items-center gap-4 text-xs">
                <span class="flex items-center text-appGreen font-semibold bg-appGreen/10 border border-appGreen/30 px-3 py-1 rounded-full"><span class="w-2.5 h-2.5 rounded-full bg-appGreen mr-2"></span> Entry Point (Buy: {trade.buyDate})</span>
                <span class="flex items-center text-appRed font-semibold bg-appRed/10 border border-appRed/30 px-3 py-1 rounded-full"><span class="w-2.5 h-2.5 rounded-full bg-appRed mr-2"></span> Exit Point (Sell: {trade.sellDate})</span>
                <span class="text-gray-400 italic">Hover over the curve to inspect exact date & price</span>
              </div>

              <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                <div class="bg-appNavy border border-appBorder rounded-lg p-4">
                  <p class="text-xs text-gray-400 mb-1">Your Buy Price</p>
                  <p class="font-bold text-white text-base">{formatPrice(trade.buyPrice)}</p>
                </div>
                <div class="bg-appNavy border border-appBorder rounded-lg p-4">
                  <p class="text-xs text-gray-400 mb-1">Your Sell Price</p>
                  <p class="font-bold text-white text-base">{formatPrice(trade.sellPrice)}</p>
                </div>
                <div class="bg-appNavy border border-appGreen/30 rounded-lg p-4">
                  <p class="text-xs text-appGreen mb-1">Ideal Entry (Window Low)</p>
                  <p id="ha-ideal-buy" class="font-bold text-white text-base">-</p>
                </div>
                <div class="bg-appNavy border border-appGreen/30 rounded-lg p-4">
                  <p class="text-xs text-appGreen mb-1">Ideal Exit (Window High)</p>
                  <p id="ha-ideal-sell" class="font-bold text-white text-base">-</p>
                </div>
              </div>

              <div class="bg-appNavy border border-appBorder rounded-xl p-4 h-72 relative">
                <div class="absolute top-2 right-4 text-[10px] text-gray-400 bg-white/5 border border-gray-600 px-2 py-1 rounded">Math Simulation Engine</div>
                <canvas ref={chartRef}></canvas>
              </div>

              <div class="bg-appNavy border border-appBorder rounded-xl p-5 relative overflow-hidden">
                <div class="absolute right-0 top-0 opacity-5 text-9xl leading-none -mt-4 -mr-4">🎯</div>
                <div class="flex justify-between items-end mb-2">
                  <h3 class="text-base font-semibold text-white">Capture Efficiency: <span id="ha-efficiency" class="text-appAccent">-%</span></h3>
                  <div class="text-right text-xs">
                    <span class="text-gray-400">Captured: <b id="ha-actual-gain" class="text-white">-%</b></span>
                    <span class="mx-2 text-gray-600">|</span>
                    <span class="text-gray-400">Max Potential: <b id="ha-ideal-gain" class="text-appGreen">-%</b></span>
                  </div>
                </div>
                
                <div class="w-full bg-appCard rounded-full h-2.5 mb-2 border border-appBorder overflow-hidden">
                  <div id="ha-efficiency-bar" class="bg-appAccent h-2.5 rounded-full transition-all duration-700" style={{ width: '0%' }}></div>
                </div>
                <p class="text-xs text-gray-400">Calculated over a continuous timeframe spanning 30 days prior to entry and 30 days post exit.</p>
              </div>
            </div>
            
            <div class="p-4 border-t border-appBorder bg-appNavy text-center shrink-0">
              <button onClick={onClose} class="px-6 py-2 bg-appCard border border-appBorder text-white font-medium rounded-lg hover:bg-white/5 transition">Close Analyzer</button>
            </div>
          </div>
        </div>
      );
    }

    // --- DASHBOARD: STATIC OPEN TRADES TRACKER (API HALTED) ---
    function LiveOpenTradesTracker({ trades, traders }) {
      const openTrades = trades.filter(t => t.status === 'Open');
      if (openTrades.length === 0) return null;

      const getTraderName = (id) => traders.find(tr => tr.id === id)?.name || 'Unknown';

      return (
        <div class="bg-appNavy border border-appBorder rounded-xl overflow-hidden mb-8 shadow-lg">
          <div class="p-4 bg-appCard border-b border-appBorder flex justify-between items-center">
            <h3 class="text-white font-medium flex items-center">
              <span class="w-2 h-2 rounded-full bg-yellow-500 mr-2"></span>
              Live Open Trades Tracker
            </h3>
            <span class="text-xs text-gray-400 border border-gray-600 px-2 py-0.5 rounded">
              Live API Halted / Paused
            </span>
          </div>
          <div class="overflow-x-auto">
            <table class="w-full text-left text-sm whitespace-nowrap">
              <thead class="bg-appNavy border-b border-appBorder text-gray-400 text-xs uppercase">
                <tr>
                  <th class="px-5 py-3">Asset</th>
                  <th class="px-5 py-3">Trader</th>
                  <th class="px-5 py-3">Buy Date</th>
                  <th class="px-5 py-3">Qty</th>
                  <th class="px-5 py-3">Buy Price</th>
                  <th class="px-5 py-3 text-appAccent font-semibold">Current Running Price</th>
                  <th class="px-5 py-3 text-appAccent border-l border-appBorder bg-white/5 font-semibold">Unrealized P&L</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-appBorder">
                {openTrades.map(t => (
                  <tr key={t.id} class="hover:bg-white/5 transition">
                    <td class="px-5 py-3 font-bold text-white">{t.symbol}</td>
                    <td class="px-5 py-3 text-gray-300">{getTraderName(t.traderId)}</td>
                    <td class="px-5 py-3 text-gray-400">{t.buyDate}</td>
                    <td class="px-5 py-3 text-gray-300">{t.qty}</td>
                    <td class="px-5 py-3 text-gray-300">{formatPrice(t.buyPrice)}</td>
                    <td class="px-5 py-3 font-bold text-appAccent">{formatPrice(t.buyPrice)}</td>
                    <td class="px-5 py-3 font-bold border-l border-appBorder bg-white/5 text-gray-500">-</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    }

    // --- PROFIT SHARE VIEW (FEATURE 2) ---
    function ProfitShareView({ trades, traders, cashLedger, traderStats }) {
      const activeTraders = traders.filter(t => t.active !== false);
      const archivedTraders = traders.filter(t => t.active === false);

      // PART A — Ongoing split for current members
      const archivedDates = archivedTraders.map(t => t.archivedAt).filter(Boolean).sort();
      const lastExitDate = archivedDates.length > 0 ? archivedDates[archivedDates.length - 1] : null;

      let profitSinceLastExit = 0;
      trades.forEach(trade => {
        if (trade.status === 'Closed') {
          if (!lastExitDate || trade.sellDate > lastExitDate) {
            profitSinceLastExit += (trade.pat - 15.34);
          }
        }
      });

      let totalInvestedNow = 0;
      activeTraders.forEach(t => {
        const inv = traderStats[t.id]?.netInvested || 0;
        totalInvestedNow += inv;
      });

      const currentMemberRows = activeTraders.map(t => {
        const investedNow = traderStats[t.id]?.netInvested || 0;
        const pctOfPool = totalInvestedNow > 0 ? (investedNow / totalInvestedNow) : 0;
        const profitShare = pctOfPool * profitSinceLastExit;
        return {
          id: t.id,
          name: t.name,
          investedNow,
          pctOfPool,
          profitShare
        };
      });

      const totalCashAvailableActive = activeTraders.reduce((sum, t) => sum + (traderStats[t.id]?.cashHolding || 0), 0);
      const totalDeployedActive = activeTraders.reduce((sum, t) => sum + (traderStats[t.id]?.amountDeployed || 0), 0);

      // PART B — Interactive state for actual payouts given to past members
      const [customPaidMap, setCustomPaidMap] = useState({});

      const getArchivedStats = (trader) => {
        const cutoverDate = trader.archivedAt;
        let profitBeforeCutover = 0;
        trades.forEach(trade => {
          if (trade.status === 'Closed') {
            if (!cutoverDate || (trade.sellDate && trade.sellDate <= cutoverDate)) {
              profitBeforeCutover += (trade.pat - 15.34);
            }
          }
        });

        // Determine who was in the fund as of this cutover date
        const eligibleTraders = traders.filter(other => {
          const earliestInv = cashLedger
            .filter(e => e.purpose === 'New Investment' && e.fromMemberId === other.id)
            .map(e => e.date)
            .sort()[0];
          
          if (!earliestInv || (cutoverDate && earliestInv > cutoverDate)) return false;
          if (other.active === false && other.archivedAt && cutoverDate && other.archivedAt < cutoverDate) return false;
          return true;
        });

        let totalInvestedAsOfCutover = 0;
        const investedByTrader = {};

        eligibleTraders.forEach(other => {
          let invested = 0;
          cashLedger.forEach(e => {
            if (e.fromMemberId === other.id) {
              if (e.purpose === 'New Investment') {
                if (!cutoverDate || e.date <= cutoverDate) invested += e.amount;
              } else if (e.purpose === 'Withdrawal') {
                if (!cutoverDate || e.date < cutoverDate) invested -= e.amount;
              }
            }
          });
          invested = Math.max(0, invested);
          investedByTrader[other.id] = invested;
          totalInvestedAsOfCutover += invested;
        });

        const thisTraderInvested = investedByTrader[trader.id] || 0;
        const sharePct = totalInvestedAsOfCutover > 0 ? (thisTraderInvested / totalInvestedAsOfCutover) : 0;
        const fairShareOfProfit = sharePct * profitBeforeCutover;
        const fairTotalPayout = thisTraderInvested + fairShareOfProfit;

        // Default actuallyPaid from withdrawal entries on/after cutoverDate
        const loggedWithdrawals = cashLedger
          .filter(e => e.fromMemberId === trader.id && e.purpose === 'Withdrawal' && (!cutoverDate || e.date >= cutoverDate))
          .reduce((sum, e) => sum + e.amount, 0);

        const actuallyPaid = customPaidMap[trader.id] !== undefined ? customPaidMap[trader.id] : loggedWithdrawals;
        const difference = actuallyPaid - fairTotalPayout;

        return {
          cutoverDate,
          profitBeforeCutover,
          thisTraderInvested,
          sharePct,
          fairShareOfProfit,
          fairTotalPayout,
          actuallyPaid,
          difference
        };
      };

      return (
        <div class="animate-fade-in space-y-8">
          <div class="bg-appNavy border border-appBorder rounded-xl p-6 shadow-inner">
            <h1 class="text-2xl font-semibold text-white">Profit Share by Investment</h1>
            <p class="text-sm text-gray-400 mt-1">
              All members pool their money together. Profits are shared strictly in proportion to how much of your own money was in the pool.
            </p>
          </div>

          {/* Quick High-Level Cards */}
          <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="bg-appNavy border border-appBorder rounded-xl p-6">
              <p class="text-gray-400 text-sm font-medium mb-1">Cash Available in Pool</p>
              <p class="text-3xl font-bold text-appAccent">{formatMoney(totalCashAvailableActive)}</p>
              <p class="text-xs text-gray-500 mt-1">Spendable cash held across active members</p>
            </div>
            <div class="bg-appNavy border border-appBorder rounded-xl p-6">
              <p class="text-gray-400 text-sm font-medium mb-1">Amount in Open Trades</p>
              <p class="text-3xl font-bold text-gray-300">{formatMoney(totalDeployedActive)}</p>
              <p class="text-xs text-gray-500 mt-1">Capital currently tied up in active positions</p>
            </div>
            <div class="bg-appNavy border border-appBorder rounded-xl p-6">
              <p class="text-gray-400 text-sm font-medium mb-1">Pool Profit {lastExitDate ? `(Since ${lastExitDate})` : '(All-Time)'}</p>
              <p class={`text-3xl font-bold ${profitSinceLastExit >= 0 ? 'text-appGreen' : 'text-appRed'}`}>{formatMoney(profitSinceLastExit)}</p>
              <p class="text-xs text-gray-500 mt-1">Net closed trade return (post-tax & demat fee)</p>
            </div>
          </div>

          {/* PART A: Current Members Table */}
          <div class="bg-appNavy border border-appBorder rounded-xl overflow-hidden shadow-xl">
            <div class="p-5 bg-appCard border-b border-appBorder flex justify-between items-center">
              <div>
                <h3 class="text-white font-semibold text-lg">Current Members: Ongoing Profit Split</h3>
                <p class="text-xs text-gray-400 mt-0.5">
                  {lastExitDate 
                    ? `Sharing profits earned after the last member left on ${lastExitDate}.` 
                    : 'Sharing all pool profits earned since the fund started.'}
                </p>
              </div>
            </div>
            <div class="overflow-x-auto">
              <table class="w-full text-left text-sm whitespace-nowrap">
                <thead class="bg-appNavy border-b border-appBorder text-gray-400 text-xs uppercase">
                  <tr>
                    <th class="px-5 py-4 font-semibold text-white">Trader</th>
                    <th class="px-5 py-4 font-semibold">Invested Now</th>
                    <th class="px-5 py-4 font-semibold text-appAccent">% of Pool</th>
                    <th class="px-5 py-4 font-semibold text-white border-l border-appBorder bg-white/5">

                </thead>
                <tbody class="divide-y divide-appBorder/50">
                  {currentMemberRows.map((row) => (
                    <tr key={row.id} class="hover:bg-white/5 transition">
                      <td class="px-5 py-4 font-bold text-white">{row.name}</td>
                      <td class="px-5 py-4 text-gray-300">{formatMoney(row.investedNow)}</td>
                      <td class="px-5 py-4 text-appAccent font-semibold">{(row.pctOfPool * 100).toFixed(2)}%</td>
                      <td class={`px-5 py-4 font-bold border-l border-appBorder bg-white/5 ${row.profitShare >= 0 ? 'text-appGreen' : 'text-appRed'}`}>

                  {currentMemberRows.length === 0 && (
                    <tr><td colSpan="4" class="px-5 py-6 text-center text-gray-500">No active members found.</td></tr>
                  )}
                </tbody>
              </table>
            </div>
          </div>

          {/* PART B: Past Members / Audit Calculator */}
          {archivedTraders.length > 0 && (
            <div class="space-y-4 pt-4">
              <div class="border-b border-appBorder pb-2">
                <h3 class="text-xl font-semibold text-white">Past Members: Verify Past Payouts</h3>
                <p class="text-sm text-gray-400 mt-1">
                  Audit whether a departed member was paid their exact fair share of capital and realized trading profit when they left.
                </p>
              </div>

              <div class="grid grid-cols-1 gap-6">
                {archivedTraders.map(trader => {
                  const stats = getArchivedStats(trader);
                  return (
                    <div key={trader.id} class="bg-appNavy border border-appBorder rounded-xl p-6 shadow-md space-y-4">
                      <div class="flex flex-wrap items-center justify-between border-b border-appBorder/70 pb-3 gap-2">
                        <div>
                          <span class="text-lg font-bold text-white mr-2">{trader.name}</span>
                          <span class="text-xs text-gray-400">Exit Date: <b class="text-gray-200">{stats.cutoverDate || 'Not specified'}</b></span>
                        </div>
                        <span class="px-2.5 py-1 rounded text-xs bg-gray-800 text-gray-300 border border-gray-700">Archived Member</span>
                      </div>

                      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div class="bg-appCard border border-appBorder p-4 rounded-lg">
                          <p class="text-xs text-gray-400 mb-1">Their Invested Capital (at Exit)</p>
                          <p class="text-lg font-semibold text-white">{formatMoney(stats.thisTraderInvested)}</p>
                          <p class="text-[11px] text-appAccent mt-1">{(stats.sharePct * 100).toFixed(2)}% of total pool</p>
                        </div>
                        <div class="bg-appCard border border-appBorder p-4 rounded-lg">
                          <p class="text-xs text-gray-400 mb-1">Their Fair Share of Profit</p>

                        </div>
                        <div class="bg-appCard border border-appAccent/30 p-4 rounded-lg bg-appAccent/5">
                          <p class="text-xs text-appAccent font-semibold mb-1">Calculated Fair Total Payout</p>
                          <p class="text-xl font-bold text-white">{formatMoney(stats.fairTotalPayout)}</p>
                          <p class="text-[11px] text-gray-400 mt-1">Capital + fair profit share</p>
                        </div>
                      </div>

                      <div class="flex flex-wrap items-center gap-4 bg-appCard border border-appBorder p-4 rounded-lg">
                        <div class="flex-1 min-w-[240px]">
                          <label class="block text-xs font-medium text-gray-300 mb-1">
                            What did you actually pay them? (₹)
                          </label>

                            type="number" 
                            step="any"
                            value={stats.actuallyPaid}
                            onChange={(e) => {
                              const val = parseFloat(e.target.value);
                              setCustomPaidMap({ ...customPaidMap, [trader.id]: isNaN(val) ? 0 : val });
                            }}

                          />
                        </div>
                        <div class="flex-[2] min-w-[280px]">
                          <p class="text-xs text-gray-400 mb-1 font-medium">Audit Verdict:</p>
                          <p class="text-sm text-gray-200">
                            Based on the ledger, {trader.name}'s fair payout was <b class="text-white">{formatMoney(stats.fairTotalPayout)}</b> ({formatMoney(stats.thisTraderInvested)} of their own money + {formatMoney(stats.fairShareOfProfit)} profit share). You told us you paid them <b class="text-white">{formatMoney(stats.actuallyPaid)}</b>
                            {Math.abs(stats.difference) < 1 ? (
                              <span class="text-appGreen font-semibold">, which matches their fair share exactly.</span>
                            ) : stats.difference > 0 ? (
                              <span class="text-yellow-400 font-semibold">, which is {formatMoney(stats.difference)} more than that (overpaid).</span>
                            ) : (
                              <span class="text-appRed font-semibold">, which is {formatMoney(Math.abs(stats.difference))} less than that (underpaid).</span>
                            )}
                          </p>
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          )}
        </div>
      );
    }

    function MonthlyStatementView({ cashLedger, trades, traders }) {
      const allDates = [...cashLedger.map(c => c.date), ...trades.map(t => t.buyDate), ...trades.map(t => t.status === 'Closed' ? t.sellDate : null)].filter(d => d); 
      const uniqueMonths = [...new Set(allDates.map(d => String(d).substring(0, 7)))].sort().reverse(); 
      const [selectedMonth, setSelectedMonth] = useState(uniqueMonths[0] || '');

      useEffect(() => { if (!uniqueMonths.includes(selectedMonth) && uniqueMonths.length > 0) setSelectedMonth(uniqueMonths[0]); }, [uniqueMonths, selectedMonth]);

      const getCashBalancesAsOf = (targetDateStr) => {
        let bals = {}; traders.forEach(t => bals[t.id] = 0);
        cashLedger.forEach(entry => {
          if (entry.date <= targetDateStr) {
            if (entry.purpose === 'New Investment') { if (bals[entry.toMemberId] !== undefined) bals[entry.toMemberId] += entry.amount; } 
            else if (entry.purpose === 'Withdrawal') { if (bals[entry.fromMemberId] !== undefined) bals[entry.fromMemberId] -= entry.amount; } 
            else { if (bals[entry.fromMemberId] !== undefined) bals[entry.fromMemberId] -= entry.amount; if (bals[entry.toMemberId] !== undefined) bals[entry.toMemberId] += entry.amount; }
          }
        });
        trades.forEach(trade => {
          if (trade.buyDate <= targetDateStr) { if (bals[trade.traderId] !== undefined) bals[trade.traderId] -= (trade.buyPrice * trade.qty); }
          if (trade.status === 'Closed' && trade.sellDate && trade.sellDate <= targetDateStr) {
            let returned = (trade.buyPrice * trade.qty) + trade.pat - 15.34;
            if (bals[trade.traderId] !== undefined) bals[trade.traderId] += returned;
          }
        });
        return bals;
      };

      if (!selectedMonth) return <div class="p-8 text-gray-400">No data available yet to generate statements.</div>;

      const openingBalances = getCashBalancesAsOf(selectedMonth + "-00"); 
      const closingBalances = getCashBalancesAsOf(selectedMonth + "-32"); 
      let flows = {}; traders.forEach(t => flows[t.id] = { invested: 0, transfersIn: 0, transfersOut: 0, withdrawn: 0, spentOnTrades: 0, returnedFromTrades: 0, realizedPnL: 0 });

      cashLedger.forEach(entry => {
        if (entry.date.startsWith(selectedMonth)) {
          if (entry.purpose === 'New Investment') { 
            if (flows[entry.fromMemberId]) flows[entry.fromMemberId].invested += entry.amount; 
            if (entry.fromMemberId !== entry.toMemberId) { if (flows[entry.fromMemberId]) flows[entry.fromMemberId].transfersOut += entry.amount; if (flows[entry.toMemberId]) flows[entry.toMemberId].transfersIn += entry.amount; }
          } else if (entry.purpose === 'Withdrawal') { if (flows[entry.fromMemberId]) flows[entry.fromMemberId].withdrawn += entry.amount; } 
          else { if (flows[entry.fromMemberId]) flows[entry.fromMemberId].transfersOut += entry.amount; if (flows[entry.toMemberId]) flows[entry.toMemberId].transfersIn += entry.amount; }
        }
      });

      trades.forEach(trade => {
        if (trade.buyDate.startsWith(selectedMonth)) { if (flows[trade.traderId]) flows[trade.traderId].spentOnTrades += (trade.buyPrice * trade.qty); }
        if (trade.status === 'Closed' && trade.sellDate && trade.sellDate.startsWith(selectedMonth)) {
          let returned = (trade.buyPrice * trade.qty) + trade.pat - 15.34;
          if (flows[trade.traderId]) { flows[trade.traderId].returnedFromTrades += returned; flows[trade.traderId].realizedPnL += (trade.actualPnL + (trade.intradayGains || 0)); }
        }
      });

      const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
      const [year, monthStr] = selectedMonth.split('-'); const displayMonth = `${monthNames[parseInt(monthStr) - 1]} ${year}`;

      return (
        <div class="animate-fade-in space-y-6">
          <div class="flex justify-between items-center bg-appNavy border border-appBorder rounded-xl p-5 shadow-inner">
            <div><h1 class="text-2xl font-semibold text-white">Monthly Statements</h1><p class="text-sm text-gray-400 mt-1">Track exactly how cash moved in and out of every trader's hands.</p></div>
            <div class="flex items-center space-x-3"><span class="text-gray-400 font-medium">Select Month:</span><select value={selectedMonth} onChange={(e) => setSelectedMonth(e.target.value)} class="bg-appCard border border-appAccent text-white font-semibold rounded-lg px-4 py-2 focus:outline-none focus:ring-2 ring-appAccent/50 cursor-pointer">{uniqueMonths.map(m => { const [y, mStr] = m.split('-'); return <option key={m} value={m}>{monthNames[parseInt(mStr) - 1]} {y}</option>; })}</select></div>
          </div>
          <div class="bg-appNavy border border-appBorder rounded-xl overflow-hidden shadow-xl">
            <div class="p-5 bg-appCard border-b border-appBorder flex justify-between items-center"><h3 class="text-white font-semibold text-lg">Cash Flow Statement: {displayMonth}</h3><span class="text-xs text-appAccent border border-appAccent/30 bg-appAccent/10 px-3 py-1 rounded">All amounts reflect physical cash held by the trader</span></div>
            <div class="overflow-x-auto">
              <table class="w-full text-left text-sm whitespace-nowrap">
                <thead class="bg-appNavy border-b border-appBorder text-gray-400 text-xs">
                  <tr><th class="px-5 py-4 font-semibold uppercase text-white">Trader Name</th><th class="px-5 py-4 font-semibold uppercase">Opening Cash</th><th class="px-5 py-4 font-semibold uppercase text-appGreen">+ New Invested</th><th class="px-5 py-4 font-semibold uppercase text-appGreen">+ Transfers In</th><th class="px-5 py-4 font-semibold uppercase text-appRed">- Transfers Out</th><th class="px-5 py-4 font-semibold uppercase text-appRed">- Withdrawn</th><th class="px-5 py-4 font-semibold uppercase text-appRed">- Spent on Trades</th><th class="px-5 py-4 font-semibold uppercase text-appGreen">+ Returned (Net)</th><th class="px-5 py-4 font-semibold uppercase text-white border-l border-appBorder bg-white/5">= Closing Cash</th><th class="px-5 py-4 font-semibold uppercase text-gray-500 border-l border-appBorder border-r">Realized P&L</th></tr>
                </thead>
                <tbody class="divide-y divide-appBorder/50">
                  {traders.map((t) => {
                    const open = openingBalances[t.id] || 0; const close = closingBalances[t.id] || 0; const f = flows[t.id];
                    return (
                      <tr key={t.id} class="hover:bg-white/5 transition"><td class="px-5 py-4 font-bold text-white flex items-center">{t.name} {!t.active && t.active !== undefined && <span class="ml-2 px-1 rounded text-[9px] bg-gray-700 text-gray-300">Archived</span>}</td><td class="px-5 py-4 text-gray-300">{formatMoney(open)}</td><td class="px-5 py-4 text-appGreen">{f.invested > 0 ? formatMoney(f.invested) : '-'}</td><td class="px-5 py-4 text-appGreen">{f.transfersIn > 0 ? formatMoney(f.transfersIn) : '-'}</td><td class="px-5 py-4 text-appRed">{f.transfersOut > 0 ? formatMoney(f.transfersOut) : '-'}</td><td class="px-5 py-4 text-appRed">{f.withdrawn > 0 ? formatMoney(f.withdrawn) : '-'}</td><td class="px-5 py-4 text-appRed font-medium">{f.spentOnTrades > 0 ? formatMoney(f.spentOnTrades) : '-'}</td><td class="px-5 py-4 text-appGreen font-medium">{f.returnedFromTrades > 0 ? formatMoney(f.returnedFromTrades) : '-'}</td><td class="px-5 py-4 font-bold text-white border-l border-appBorder bg-white/5">{formatMoney(close)}</td><td class={`px-5 py-4 font-medium border-l border-appBorder border-r ${f.realizedPnL > 0 ? 'text-appGreen' : (f.realizedPnL < 0 ? 'text-appRed' : 'text-gray-500')}`}>{f.realizedPnL !== 0 ? formatMoney(f.realizedPnL) : '-'}</td></tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    }

    function CashLedgerView({ cashLedger, setCashLedger, traders, setTraders, trades, isAdmin }) {
      const [showForm, setShowForm] = useState(false); const [editingLedgerId, setEditingLedgerId] = useState(null); const [selectedLedgerIds, setSelectedLedgerIds] = useState([]); 
      const activeTradersList = traders.filter(t => t.active !== false);
      const emptyForm = { date: '', amount: '', fromMemberId: activeTradersList[0]?.id || '', toMemberId: activeTradersList[0]?.id || '', purpose: 'New Investment', comments: '', linkedTradeIds: [] };
      const [formData, setFormData] = useState(emptyForm);

      const handleChange = (e) => { setFormData({ ...formData, [e.target.name]: e.target.value }); };
      const handleEdit = (entry) => { setFormData({ date: cleanDateForInput(entry.date), amount: entry.amount, fromMemberId: entry.fromMemberId, toMemberId: entry.toMemberId, purpose: entry.purpose, comments: entry.comments || '', linkedTradeIds: entry.linkedTradeIds || [] }); setEditingLedgerId(entry.id); setShowForm(true); };
      const handleDelete = (entry) => { if(window.confirm('Delete this passbook entry?')) { setCashLedger(cashLedger.filter(l => l.id !== entry.id)); setSelectedLedgerIds(selectedLedgerIds.filter(id => id !== entry.id)); } };
      const handleBulkDelete = () => { if(window.confirm(`Delete these ${selectedLedgerIds.length} passbook entries?`)) { setCashLedger(cashLedger.filter(l => !selectedLedgerIds.includes(l.id))); setSelectedLedgerIds([]); } };
      const handleSelectAll = (e) => { if (e.target.checked) setSelectedLedgerIds(cashLedger.map(l => l.id)); else setSelectedLedgerIds([]); };
      const handleSubmit = (e) => { e.preventDefault(); const entry = { id: editingLedgerId || Date.now(), date: formData.date, amount: parseFloat(formData.amount), fromMemberId: parseInt(formData.fromMemberId), toMemberId: parseInt(formData.toMemberId), purpose: formData.purpose, comments: formData.comments, linkedTradeIds: formData.purpose === 'Stock Sales' ? formData.linkedTradeIds : [] }; if (editingLedgerId) { setCashLedger(cashLedger.map(l => l.id === editingLedgerId ? entry : l).sort((a, b) => new Date(b.date) - new Date(a.date))); } else { setCashLedger([...cashLedger, entry].sort((a, b) => new Date(b.date) - new Date(a.date))); } setFormData(emptyForm); setShowForm(false); setEditingLedgerId(null); };

      const fileInputRef = useRef(null); const [importStatus, setImportStatus] = useState('idle'); const [csvHeaders, setCsvHeaders] = useState([]); const [csvRawData, setCsvRawData] = useState([]); const [columnMap, setColumnMap] = useState({}); const [unknownTraders, setUnknownTraders] = useState([]); const [traderMap, setTraderMap] = useState({}); const [importSummary, setImportSummary] = useState(null);
      const expectedFields = [{ key: 'date', label: 'Date', required: true, match: ['date', 'time'] }, { key: 'amount', label: 'Amount', required: true, match: ['amount', 'value', '₹', 'price'] }, { key: 'fromMember', label: 'From Member', required: true, match: ['from', 'sender', 'who'] }, { key: 'toMember', label: 'To Member', required: true, match: ['to', 'receiver'] }, { key: 'purpose', label: 'Purpose', required: true, match: ['purpose', 'type', 'category'] }, { key: 'comments', label: 'Comments', required: false, match: ['comment', 'note', 'details', 'remarks'] }];
      const handleFileUpload = (e) => { const file = e.target.files[0]; if (!file) return; Papa.parse(file, { header: true, skipEmptyLines: true, complete: (results) => { const headers = results.meta.fields; setCsvHeaders(headers); setCsvRawData(results.data); const initialMap = {}; expectedFields.forEach(field => { const matchedHeader = headers.find(h => field.match.some(alias => h.toLowerCase().includes(alias))); if (matchedHeader) initialMap[field.key] = matchedHeader; }); setColumnMap(initialMap); detectUnknownTraders(initialMap.fromMember, initialMap.toMember, results.data); setImportStatus('mapping'); } }); e.target.value = ''; };
      const detectUnknownTraders = (fromCol, toCol, data) => { if (!fromCol && !toCol) { setUnknownTraders([]); return; } const uniqueNames = new Set(); data.forEach(row => { if (fromCol && row[fromCol]) uniqueNames.add(row[fromCol].trim()); if (toCol && row[toCol]) uniqueNames.add(row[toCol].trim()); }); const existingNamesUpper = traders.map(t => t.name.toUpperCase()); const missing = [...uniqueNames].filter(n => n && !existingNamesUpper.includes(n.toUpperCase())); setUnknownTraders(missing); const initialTraderMap = {}; missing.forEach(m => initialTraderMap[m] = 'NEW'); setTraderMap(initialTraderMap); };
      const handleColumnMapChange = (fieldKey, selectedHeader) => { const newMap = { ...columnMap, [fieldKey]: selectedHeader }; setColumnMap(newMap); detectUnknownTraders(newMap.fromMember, newMap.toMember, csvRawData); };
      const executeImport = () => { let successfulEntries = []; let failedRows = []; let newlyAddedTraders = [...traders]; const parseNum = (val) => { if (!val) return null; const num = parseFloat(String(val).replace(/[^0-9.-]+/g,"")); return isNaN(num) ? null : num; }; const resolveTraderId = (nameString) => { if (!nameString) return null; nameString = nameString.trim(); const existingMatch = newlyAddedTraders.find(t => t.name.toUpperCase() === nameString.toUpperCase()); if (existingMatch) return existingMatch.id; const decision = traderMap[nameString]; if (decision === 'NEW') { const newTrader = { id: Date.now() + Math.random(), name: nameString, active: true }; newlyAddedTraders.push(newTrader); return newTrader.id; } return parseInt(decision); };
        csvRawData.forEach((row, index) => {
          const date = cleanDateForInput(row[columnMap.date]); const amt = parseNum(row[columnMap.amount]); const fromName = row[columnMap.fromMember]; const toName = row[columnMap.toMember]; const rawPurpose = row[columnMap.purpose] || '';
          if (!date || amt === null || !fromName || !toName) { failedRows.push(`Row ${index + 2}: Missing mandatory fields`); return; }
          const fromId = resolveTraderId(fromName); const toId = resolveTraderId(toName); const validPurposes = ['New Investment', 'Stock Sales', 'Custody Transfer', 'Withdrawal', 'Other']; const matchedPurpose = validPurposes.find(p => p.toLowerCase() === rawPurpose.trim().toLowerCase()) || 'Other';
          const entry = { id: Date.now() + Math.random(), date: date, amount: amt, fromMemberId: fromId, toMemberId: toId, purpose: matchedPurpose, comments: row[columnMap.comments] || '', linkedTradeIds: [] };
          successfulEntries.push(entry);
        });
        setTraders(newlyAddedTraders); setCashLedger([...cashLedger, ...successfulEntries].sort((a, b) => new Date(b.date) - new Date(a.date))); setImportSummary({ successCount: successfulEntries.length, fails: failedRows }); setImportStatus('summary');
      };

      const getTraderName = (id) => traders.find(tr => tr.id === id)?.name || 'Unknown';
      
      const contributions = cashLedger.filter(c => c.purpose === 'New Investment'); 
      const uniqueMonths = [...new Set(contributions.filter(c => c && c.date).map(c => String(c.date).substring(0, 7)))].sort(); 
      
      const gridData = {}; 
      traders.forEach(t => { 
        gridData[t.id] = { name: t.name, active: t.active !== false, totalNet: 0, months: {} }; 
        uniqueMonths.forEach(m => gridData[t.id].months[m] = 0); 
      });
      
      cashLedger.forEach(entry => { 
        if (!entry.date) return; 
        const monthKey = String(entry.date).substring(0, 7); 
        if (entry.purpose === 'New Investment' && gridData[entry.fromMemberId]) { 
          gridData[entry.fromMemberId].months[monthKey] += entry.amount; 
          gridData[entry.fromMemberId].totalNet += entry.amount; 
        } 
      });

      return (
        <div class="animate-fade-in space-y-8">
          <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-semibold text-white">Cash Ledger & Contributions</h1>
            {isAdmin && (
              <div class="space-x-3 flex items-center">
                {selectedLedgerIds.length > 0 && <button onClick={handleBulkDelete} class="bg-appRed text-white font-semibold px-4 py-2 rounded-lg hover:bg-red-500 transition animate-fade-in">Delete Selected ({selectedLedgerIds.length})</button>}
                <input type="file" accept=".csv" ref={fileInputRef} onChange={handleFileUpload} class="hidden" />
                <button onClick={() => fileInputRef.current.click()} class="bg-appCard border border-appBorder text-white font-semibold px-4 py-2 rounded-lg hover:bg-white/5 transition">↑ Upload CSV</button>
                <button onClick={() => { setFormData(emptyForm); setEditingLedgerId(null); setShowForm(!showForm); setImportStatus('idle'); }} class="bg-appAccent text-appNavy font-semibold px-4 py-2 rounded-lg hover:bg-sky-400 transition">{showForm ? 'Cancel' : '+ Add Passbook Entry'}</button>
              </div>
            )}
          </div>
          {importStatus === 'mapping' && ( <div class="bg-appNavy border border-appBorder rounded-xl p-6 mb-8 shadow-inner animate-fade-in"><h2 class="text-xl text-white mb-2">Map CSV Columns</h2><div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">{expectedFields.map(field => (<div key={field.key} class="bg-appCard p-4 rounded-lg border border-appBorder"><label class="block text-sm text-white mb-2">{field.label} {field.required && <span class="text-appRed">*</span>}</label><select value={columnMap[field.key] || ''} onChange={(e) => handleColumnMapChange(field.key, e.target.value)} class="w-full bg-appNavy border border-appBorder text-white rounded px-3 py-2 text-sm focus:border-appAccent outline-none"><option value="" class="italic text-gray-500">-- Not in this file --</option>{csvHeaders.map(header => <option key={header} value={header}>{header}</option>)}</select></div>))}</div>{unknownTraders.length > 0 && ( <div class="mb-8 p-5 bg-appCard border border-yellow-500/30 rounded-xl"><h3 class="text-yellow-500 font-semibold mb-2">⚠ Unknown Traders Found</h3><div class="grid grid-cols-1 md:grid-cols-2 gap-4">{unknownTraders.map(ut => (<div key={ut} class="flex items-center justify-between bg-appNavy p-3 rounded border border-appBorder"><span class="text-white text-sm font-medium">"{ut}"</span><select value={traderMap[ut]} onChange={(e) => setTraderMap({...traderMap, [ut]: e.target.value})} class="bg-appCard border border-appBorder text-white rounded px-2 py-1 text-sm outline-none"><option value="NEW">+ Add as New Trader</option><optgroup label="Map to existing:">{traders.map(t => <option key={t.id} value={t.id}>{t.name}</option>)}</optgroup></select></div>))}</div></div> )}<div class="flex justify-between items-center border-t border-appBorder pt-4"><button onClick={() => setImportStatus('idle')} class="text-gray-400 hover:text-white transition">Cancel Import</button><button onClick={executeImport} class="bg-appGreen text-appNavy font-bold px-6 py-2 rounded-lg hover:bg-green-400 transition">Confirm & Import Data</button></div></div> )}

    }

    function TradeLogView({ trades, setTrades, traders, setTraders, cashLedger, setCashLedger, isAdmin }) {
      const [showForm, setShowForm] = useState(false); const [editingTradeId, setEditingTradeId] = useState(null); const [filterTrader, setFilterTrader] = useState('All'); const [filterStatus, setFilterStatus] = useState('All'); const [selectedTradeIds, setSelectedTradeIds] = useState([]); 
      const [analyzerTrade, setAnalyzerTrade] = useState(null);

      const activeTradersList = traders.filter(t => t.active !== false);
      const emptyForm = { symbol: '', traderId: activeTradersList[0]?.id || '', buyDate: '', sellDate: '', qty: '', buyPrice: '', sellPrice: '', isIntraday: 'false', actualPnL: '', intradayGains: '', pat: '', notes: '', capitalInjected: '', linkedLedgerEntryId: null };
      const [formData, setFormData] = useState(emptyForm);
      
      const handleChange = (e) => { 
        const { name, value } = e.target; 
        let newFormData = { ...formData, [name]: value }; 
        if (name === 'actualPnL' || name === 'intradayGains') {

          const ig = name === 'intradayGains' ? parseFloat(value) || 0 : parseFloat(formData.intradayGains) || 0;
          const totalPreTax = pnl + ig;

        }

      };

      const handleEdit = (trade) => { const linkedLedger = trade.linkedLedgerEntryId ? cashLedger.find(l => l.id === trade.linkedLedgerEntryId) : null; setFormData({ symbol: trade.symbol, traderId: trade.traderId, buyDate: cleanDateForInput(trade.buyDate), sellDate: cleanDateForInput(trade.sellDate) || '', qty: trade.qty, buyPrice: trade.buyPrice, sellPrice: trade.sellPrice || '', isIntraday: trade.isIntraday ? 'true' : 'false', actualPnL: trade.actualPnL || '', intradayGains: trade.intradayGains || '', pat: trade.pat || '', notes: trade.notes || '', capitalInjected: linkedLedger ? linkedLedger.amount : '', linkedLedgerEntryId: trade.linkedLedgerEntryId || null }); setEditingTradeId(trade.id); setShowForm(true); };
      const handleDeleteTrade = (tradeToDelete) => { if(window.confirm(`Delete trade for ${tradeToDelete.symbol}?`)) { if (tradeToDelete.linkedLedgerEntryId) setCashLedger(cashLedger.filter(l => l.id !== tradeToDelete.linkedLedgerEntryId)); setTrades(trades.filter(t => t.id !== tradeToDelete.id)); setSelectedTradeIds(selectedTradeIds.filter(id => id !== tradeToDelete.id)); } };
      const handleBulkDelete = () => { if(window.confirm(`Delete ${selectedTradeIds.length} trades?`)) { const tradesToDelete = trades.filter(t => selectedTradeIds.includes(t.id)); const ledgerIdsToDelete = tradesToDelete.map(t => t.linkedLedgerEntryId).filter(id => id !== null); if (ledgerIdsToDelete.length > 0) setCashLedger(cashLedger.filter(l => !ledgerIdsToDelete.includes(l.id))); setTrades(trades.filter(t => !selectedTradeIds.includes(t.id))); setSelectedTradeIds([]); } };
      
      const handleSubmit = (e) => { 
        e.preventDefault(); 
        const isClosed = formData.sellDate !== '' && formData.sellPrice !== ''; 
        const injectedAmt = parseFloat(formData.capitalInjected || 0); 
        let newLedgerId = formData.linkedLedgerEntryId; let updatedLedger = [...cashLedger]; 
        if (editingTradeId) { if (injectedAmt > 0) { if (newLedgerId && updatedLedger.some(l => l.id === newLedgerId)) updatedLedger = updatedLedger.map(l => l.id === newLedgerId ? { ...l, amount: injectedAmt, date: formData.buyDate, fromMemberId: parseInt(formData.traderId), toMemberId: parseInt(formData.traderId) } : l); else { newLedgerId = Date.now() + 999; updatedLedger.push({ id: newLedgerId, date: formData.buyDate, amount: injectedAmt, fromMemberId: parseInt(formData.traderId), toMemberId: parseInt(formData.traderId), purpose: 'New Investment', comments: `Auto-added from Trade Edit (${formData.symbol.toUpperCase()})`, linkedTradeIds: [] }); } } else { if (newLedgerId) { updatedLedger = updatedLedger.filter(l => l.id !== newLedgerId); newLedgerId = null; } } } else { if (injectedAmt > 0) { newLedgerId = Date.now() + 999; updatedLedger.push({ id: newLedgerId, date: formData.buyDate, amount: injectedAmt, fromMemberId: parseInt(formData.traderId), toMemberId: parseInt(formData.traderId), purpose: 'New Investment', comments: `Auto-added from Trade Log (${formData.symbol.toUpperCase()})`, linkedTradeIds: [] }); } } setCashLedger(updatedLedger.sort((a, b) => new Date(b.date) - new Date(a.date))); 
        
        const newTrade = { 
          id: editingTradeId || Date.now(), symbol: formData.symbol.toUpperCase(), traderId: parseInt(formData.traderId), 
          buyDate: formData.buyDate, sellDate: isClosed ? formData.sellDate : null, qty: parseFloat(formData.qty), 
          buyPrice: parseFloat(formData.buyPrice), sellPrice: isClosed ? parseFloat(formData.sellPrice) : null, 
          isIntraday: formData.isIntraday === 'true', actualPnL: isClosed ? parseFloat(formData.actualPnL || 0) : 0, 
          intradayGains: isClosed ? parseFloat(formData.intradayGains || 0) : 0, pat: isClosed ? parseFloat(formData.pat || 0) : 0, 
          notes: formData.notes, status: isClosed ? 'Closed' : 'Open', linkedLedgerEntryId: newLedgerId 
        }; 
        if (editingTradeId) setTrades(trades.map(t => t.id === editingTradeId ? newTrade : t)); else setTrades([...trades, newTrade]); setFormData(emptyForm); setShowForm(false); setEditingTradeId(null); 
      };

      const fileInputRef = useRef(null); const [importStatus, setImportStatus] = useState('idle'); const [csvHeaders, setCsvHeaders] = useState([]); const [csvRawData, setCsvRawData] = useState([]); const [columnMap, setColumnMap] = useState({}); const [unknownTraders, setUnknownTraders] = useState([]); const [traderMap, setTraderMap] = useState({}); const [importSummary, setImportSummary] = useState(null);
      const expectedFields = [{ key: 'symbol', label: 'Symbol / Stock', required: true, match: ['symbol', 'stock'] }, { key: 'traderName', label: 'Trader Name', required: true, match: ['trader', 'member'] }, { key: 'buyDate', label: 'Buy Date', required: true, match: ['buy date', 'date'] }, { key: 'qty', label: 'Quantity', required: true, match: ['qty', 'quantity'] }, { key: 'buyPrice', label: 'Buy Price', required: true, match: ['buy price', 'entry'] }, { key: 'sellDate', label: 'Sell Date', required: false, match: ['sell date', 'exit date'] }, { key: 'sellPrice', label: 'Sell Price', required: false, match: ['sell price', 'exit price'] }, { key: 'isIntraday', label: 'Intraday?', required: false, match: ['intraday'] }, { key: 'actualPnL', label: 'Pre-Tax Return', required: false, match: ['actual pnl', 'pnl', 'pre-tax'] }, { key: 'intradayGains', label: 'Intraday Gains', required: false, match: ['intra gain', 'intraday gain'] }, { key: 'pat', label: 'Post-Tax (PAT)', required: false, match: ['pat', 'post-tax'] }, { key: 'notes', label: 'Notes', required: false, match: ['notes', 'comments'] }];
      const handleFileUpload = (e) => { const file = e.target.files[0]; if (!file) return; Papa.parse(file, { header: true, skipEmptyLines: true, complete: (results) => { setCsvHeaders(results.meta.fields); setCsvRawData(results.data); const initialMap = {}; expectedFields.forEach(field => { const matchedHeader = results.meta.fields.find(h => field.match.some(alias => h.toLowerCase().includes(alias))); if (matchedHeader) initialMap[field.key] = matchedHeader; }); setColumnMap(initialMap); detectUnknownTraders(initialMap.traderName, results.data); setImportStatus('mapping'); } }); e.target.value = ''; };
      const detectUnknownTraders = (traderColName, data) => { if (!traderColName) { setUnknownTraders([]); return; } const uniqueNamesInCSV = [...new Set(data.map(row => (row[traderColName] || '').trim()).filter(n => n !== ''))]; const existingNamesUpper = traders.map(t => t.name.toUpperCase()); const missing = uniqueNamesInCSV.filter(name => !existingNamesUpper.includes(name.toUpperCase())); setUnknownTraders(missing); const initialTraderMap = {}; missing.forEach(m => initialTraderMap[m] = 'NEW'); setTraderMap(initialTraderMap); };
      const handleColumnMapChange = (fieldKey, selectedHeader) => { const newMap = { ...columnMap, [fieldKey]: selectedHeader }; setColumnMap(newMap); if (fieldKey === 'traderName') detectUnknownTraders(selectedHeader, csvRawData); };
      const executeImport = () => { let successfulTrades = []; let failedRows = []; let newlyAddedTraders = [...traders]; const parseNum = (val) => { if (!val) return null; const num = parseFloat(String(val).replace(/[^0-9.-]+/g,"")); return isNaN(num) ? null : num; }; csvRawData.forEach((row, index) => { const sym = row[columnMap.symbol]; const bDate = cleanDateForInput(row[columnMap.buyDate]); const bPrice = parseNum(row[columnMap.buyPrice]); const qty = parseNum(row[columnMap.qty]); const traderNameString = (row[columnMap.traderName] || '').trim(); if (!sym || !bDate || bPrice === null || qty === null || !traderNameString) { failedRows.push(`Row ${index + 2}: Missing mandatory fields`); return; } let finalTraderId = null; const existingMatch = newlyAddedTraders.find(t => t.name.toUpperCase() === traderNameString.toUpperCase()); if (existingMatch) { finalTraderId = existingMatch.id; } else { const decision = traderMap[traderNameString]; if (decision === 'NEW') { const newTrader = { id: Date.now() + Math.random(), name: traderNameString, active: true }; newlyAddedTraders.push(newTrader); finalTraderId = newTrader.id; } else { finalTraderId = parseInt(decision); } } const sDate = cleanDateForInput(row[columnMap.sellDate]) || null; const sPrice = parseNum(row[columnMap.sellPrice]); const isClosed = sDate && sPrice !== null; const rawIntraday = (row[columnMap.isIntraday] || '').toLowerCase(); const isIntraday = ['yes', 'true', '1', 'y'].includes(rawIntraday); let importedActual = parseNum(row[columnMap.actualPnL]) || 0; let importedIntra = parseNum(row[columnMap.intradayGains]) || 0; let importedPat = parseNum(row[columnMap.pat]); if (importedPat === null && isClosed) { let preTax = importedActual + importedIntra; importedPat = preTax > 0 ? preTax * 0.8 : preTax; } const trade = { id: Date.now() + Math.random(), symbol: sym.toUpperCase(), traderId: finalTraderId, buyDate: bDate, sellDate: isClosed ? sDate : null, qty: qty, buyPrice: bPrice, sellPrice: isClosed ? sPrice : null, isIntraday: isIntraday, actualPnL: isClosed ? importedActual : 0, intradayGains: isClosed ? importedIntra : 0, pat: isClosed ? (importedPat || 0) : 0, notes: row[columnMap.notes] || '', status: isClosed ? 'Closed' : 'Open', linkedLedgerEntryId: null }; successfulTrades.push(trade); }); setTraders(newlyAddedTraders); setTrades([...trades, ...successfulTrades]); setImportSummary({ successCount: successfulTrades.length, fails: failedRows }); setImportStatus('summary'); };

      const filteredTrades = trades.filter(t => (filterTrader === 'All' || t.traderId === parseInt(filterTrader)) && (filterStatus === 'All' || t.status === filterStatus));
      const totalActualPnL = filteredTrades.reduce((sum, t) => sum + (t.actualPnL || 0) + (t.intradayGains || 0), 0); 
      const totalPAT = filteredTrades.reduce((sum, t) => sum + (t.pat || 0), 0);
      const getDaysHeld = (t) => { if (t.status === 'Open') return 'Open'; const days = Math.floor((new Date(t.sellDate) - new Date(t.buyDate)) / (1000 * 60 * 60 * 24)); return days === 0 ? 'Same Day' : `${days}`; };
      const getTraderName = (id) => traders.find(tr => tr.id === id)?.name || 'Unknown';
      const handleSelectAll = (e) => { if (e.target.checked) setSelectedTradeIds(filteredTrades.map(t => t.id)); else setSelectedTradeIds([]); };

      return (
        <div class="animate-fade-in">
          <HindsightAnalyzer trade={analyzerTrade} onClose={() => setAnalyzerTrade(null)} />

          <div class="flex justify-between items-center mb-6">

                {selectedTradeIds.length > 0 && <button onClick={handleBulkDelete} class="bg-appRed text-white font-semibold px-4 py-2 rounded-lg hover:bg-red-500 transition animate-fade-in">Delete Selected ({selectedTradeIds.length})</button>}
