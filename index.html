            )}
          </div>

          {importStatus === 'mapping' && ( <div class="bg-appNavy border border-appBorder rounded-xl p-6 mb-8 shadow-inner animate-fade-in"><h2 class="text-xl text-white mb-2">Map CSV Columns</h2><div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">{expectedFields.map(field => (<div key={field.key} class="bg-appCard p-4 rounded-lg border border-appBorder"><label class="block text-sm text-white mb-2">{field.label}</label><select value={columnMap[field.key] || ''} onChange={(e) => handleColumnMapChange(field.key, e.target.value)} class="w-full bg-appNavy border border-appBorder text-white rounded px-3 py-2 text-sm focus:border-appAccent outline-none"><option value="" class="italic text-gray-500">-- Not in this file --</option>{csvHeaders.map(header => <option key={header} value={header}>{header}</option>)}</select></div>))}</div><div class="flex justify-between border-t border-appBorder pt-4"><button onClick={() => setImportStatus('idle')} class="text-gray-400 hover:text-white transition">Cancel Import</button><button onClick={executeImport} class="bg-appGreen text-appNavy font-bold px-6 py-2 rounded-lg hover:bg-green-400 transition">Confirm & Import Data</button></div></div> )}
          {importStatus === 'summary' && importSummary && ( <div class="bg-appNavy border border-appBorder rounded-xl p-6 mb-8 shadow-inner animate-fade-in"><h2 class="text-xl text-white mb-4">Import Complete!</h2><p class="text-appGreen text-lg mb-4">✅ Successfully imported <b>{importSummary.successCount}</b> trades.</p><button onClick={() => setImportStatus('idle')} class="bg-appCard text-white px-4 py-2 rounded">Close</button></div> )}

          {showForm && importStatus === 'idle' && (
            <div class="bg-appNavy border border-appBorder rounded-xl p-6 mb-8 shadow-inner animate-fade-in">
              <form onSubmit={handleSubmit}>
                <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-4">
                  <div><label class="block text-xs text-gray-400 mb-1">Symbol/Stock</label><input required name="symbol" value={formData.symbol} onChange={handleChange} type="text" class="w-full bg-appCard border border-appBorder text-white rounded px-3 py-2 text-sm outline-none uppercase" /></div>
                  <div><label class="block text-xs text-gray-400 mb-1">Trader</label><select required name="traderId" value={formData.traderId} onChange={handleChange} class="w-full bg-appCard border border-appBorder text-white rounded px-3 py-2 text-sm outline-none">{traders.filter(t => t.active !== false || t.id === parseInt(formData.traderId)).map(t => <option key={t.id} value={t.id}>{t.name}</option>)}</select></div>
                  <div><label class="block text-xs text-gray-400 mb-1">Intraday?</label><select name="isIntraday" value={formData.isIntraday} onChange={handleChange} class="w-full bg-appCard border border-appBorder text-white rounded px-3 py-2 text-sm outline-none"><option value="false">No</option><option value="true">Yes</option></select></div>
                  <div><label class="block text-xs text-gray-400 mb-1">Quantity</label><input required name="qty" value={formData.qty} onChange={handleChange} type="number" step="any" class="w-full bg-appCard border border-appBorder text-white rounded px-3 py-2 text-sm outline-none" /></div>
                  <div><label class="block text-xs text-gray-400 mb-1">Buy Date</label><input required name="buyDate" value={formData.buyDate} onChange={handleChange} type="date" class="w-full bg-appCard border border-appBorder text-gray-300 rounded px-3 py-2 text-sm outline-none" /></div>
                  <div><label class="block text-xs text-gray-400 mb-1">Buy Price (₹)</label><input required name="buyPrice" value={formData.buyPrice} onChange={handleChange} type="number" step="any" class="w-full bg-appCard border border-appBorder text-white rounded px-3 py-2 text-sm outline-none" /></div>
                  <div><label class="block text-xs text-gray-400 mb-1">Sell Date</label><input name="sellDate" value={formData.sellDate} onChange={handleChange} type="date" class="w-full bg-appCard border border-appBorder text-gray-300 rounded px-3 py-2 text-sm outline-none" /></div>
                  <div><label class="block text-xs text-gray-400 mb-1">Sell Price</label><input name="sellPrice" value={formData.sellPrice} onChange={handleChange} type="number" step="any" class="w-full bg-appCard border border-appBorder text-white rounded px-3 py-2 text-sm outline-none" /></div>
                </div>
                <div class="bg-appAccent/10 border border-appAccent/30 rounded-lg p-4 mb-4">
                  <div class="md:w-1/3"><label class="block text-xs font-semibold text-appAccent mb-1">New Capital Added? (₹)</label><input name="capitalInjected" value={formData.capitalInjected} onChange={handleChange} type="number" step="any" class="w-full bg-appCard border border-appAccent text-white rounded px-3 py-2 text-sm outline-none" /></div>
                </div>
                <div class="border-t border-appBorder pt-4 mb-4 grid grid-cols-1 md:grid-cols-4 gap-4">
                  <div class="md:col-span-4"><p class="text-xs text-appAccent">Manual Tax & Profit Entry</p></div>
                  <div><label class="block text-xs text-gray-400 mb-1">Actual P&L (₹)</label><input name="actualPnL" value={formData.actualPnL} onChange={handleChange} type="number" step="any" class="w-full bg-appCard border border-appBorder text-white rounded px-3 py-2 text-sm outline-none border-appAccent" placeholder="Enter profit or loss..." /></div>
                  <div><label class="block text-xs text-gray-400 mb-1">Intraday Gains (₹)</label><input name="intradayGains" value={formData.intradayGains} onChange={handleChange} type="number" step="any" class="w-full bg-appCard border border-appBorder text-white rounded px-3 py-2 text-sm outline-none border-appAccent" placeholder="0.00" /></div>
                  <div><label class="block text-xs text-gray-400 mb-1">Post-Tax (PAT) (₹)</label><input name="pat" value={formData.pat} onChange={handleChange} type="number" step="any" class="w-full bg-appCard border border-appBorder text-appGreen font-semibold rounded px-3 py-2 text-sm outline-none bg-appGreen/5" title="Auto-deducts 20% on total profit. Losses stay identical." /></div>
                  <div><label class="block text-xs text-gray-400 mb-1">Notes</label><input name="notes" value={formData.notes} onChange={handleChange} type="text" class="w-full bg-appCard border border-appBorder text-white rounded px-3 py-2 text-sm outline-none" /></div>
                </div>
                <div class="flex justify-end"><button type="submit" class="bg-appGreen text-appNavy font-bold px-6 py-2 rounded-lg hover:bg-green-400 transition">Save Trade</button></div>
              </form>
            </div>
          )}

          {importStatus === 'idle' && (
            <div class="bg-appNavy border border-appBorder rounded-xl pb-2 overflow-x-auto">
              <div class="flex space-x-4 p-4 border-b border-appBorder">
                <select value={filterStatus} onChange={(e) => setFilterStatus(e.target.value)} class="bg-appNavy border border-appBorder text-white rounded px-3 py-1 text-sm outline-none"><option value="All">All</option><option value="Open">Open</option><option value="Closed">Closed</option></select>
                <select value={filterTrader} onChange={(e) => setFilterTrader(e.target.value)} class="bg-appNavy border border-appBorder text-white rounded px-3 py-1 text-sm outline-none"><option value="All">All Traders</option>{traders.map(t => <option key={t.id} value={t.id}>{t.name} {t.active === false ? '(Archived)' : ''}</option>)}</select>
              </div>
              <table class="w-full text-left text-xs whitespace-nowrap">
                <thead class="bg-appCard border-b border-appBorder text-gray-400 uppercase">
                  <tr>
                    {isAdmin && <th class="p-2 w-8"><input type="checkbox" class="accent-appAccent cursor-pointer" checked={filteredTrades.length > 0 && selectedTradeIds.length === filteredTrades.length} onChange={handleSelectAll} /></th>}
                    <th class="p-2">Asset</th>
                    <th class="p-2">Trader</th>
                    <th class="p-2">Dates</th>
                    <th class="p-2">Qty</th>
                    <th class="p-2">Prices (B/S)</th>
                    <th class="p-2 border-l border-appBorder bg-white/5">Invested</th>
                    <th class="p-2 border-l border-appBorder bg-white/5 text-gray-300">Pre-Tax P&L</th>
                    <th class="p-2 text-gray-300">+ Intra Gains</th>
                    <th class="p-2 text-gray-300">PAT (-20%)</th>
                    <th class="p-2 border-l border-appBorder bg-white/5 font-semibold text-appAccent">Net Return <span class="text-[9px] font-normal block">-₹15.34 DP</span></th>
                    {isAdmin && <th class="p-2 text-center">Action</th>}
                  </tr>
                </thead>
                <tbody class="divide-y divide-appBorder">
                  {filteredTrades.map((t) => {
                    const invested = t.buyPrice * t.qty;
                    const netReturn = t.status === 'Closed' ? invested + t.pat - 15.34 : null;
                    const ig = t.intradayGains || 0;
                    
                    return (
                      <tr key={t.id} class="hover:bg-white/5 transition">
                        {isAdmin && <td class="p-2"><input type="checkbox" class="accent-appAccent cursor-pointer" checked={selectedTradeIds.includes(t.id)} onChange={(e) => { if (e.target.checked) setSelectedTradeIds([...selectedTradeIds, t.id]); else setSelectedTradeIds(selectedTradeIds.filter(id => id !== t.id)); }} /></td>}
                        
                        <td class="p-2 flex items-center space-x-2">
                          <div>
                            <div class="font-bold text-white tracking-wide">{t.symbol} {t.isIntraday && <span class="text-[9px] bg-appAccent/20 text-appAccent px-1 rounded ml-1">INT</span>}</div>
                            <span class={`text-[10px] px-1 rounded ${t.status === 'Open' ? 'bg-yellow-500/10 text-yellow-500' : 'bg-gray-500/10 text-gray-400'}`}>{t.status}</span>
                          </div>
                          {t.status === 'Closed' && (
                            <button onClick={() => setAnalyzerTrade(t)} class="text-xl hover:scale-110 transition-transform" title="Open Hindsight Analyzer">📈</button>
                          )}
                        </td>
                        
                        <td class="p-2 text-gray-300 font-medium">{getTraderName(t.traderId)}</td>
                        <td class="p-2 text-gray-300"><div><span class="text-gray-500 text-[10px]">B:</span> {t.buyDate}</div><div><span class="text-gray-500 text-[10px]">S:</span> {t.status === 'Closed' ? t.sellDate : '-'}</div><div class="text-[10px] text-gray-500">{t.status === 'Closed' ? `${getDaysHeld(t)} days` : ''}</div></td>
                        <td class="p-2 text-gray-300">{t.qty}</td>
                        <td class="p-2 text-gray-300"><div><span class="text-gray-500 text-[10px]">B:</span> {formatPrice(t.buyPrice)}</div><div><span class="text-gray-500 text-[10px]">S:</span> {t.status === 'Closed' ? formatPrice(t.sellPrice) : '-'}</div></td>
                        <td class="p-2 border-l border-appBorder bg-white/5 text-gray-300">{formatMoney(invested)}</td>
                        
                        <td class={`p-2 border-l border-appBorder bg-white/5 font-bold ${t.status === 'Open' ? 'text-gray-500' : (t.actualPnL >= 0 ? 'text-appGreen' : 'text-appRed')}`}>{t.status === 'Closed' ? formatMoney(t.actualPnL) : '-'}</td>
                        <td class={`p-2 font-bold ${t.status === 'Open' ? 'text-gray-500' : (ig >= 0 ? 'text-appGreen' : 'text-appRed')}`}>{t.status === 'Closed' ? formatMoney(ig) : '-'}</td>
                        <td class={`p-2 font-bold ${t.status === 'Open' ? 'text-gray-500' : (t.pat >= 0 ? 'text-appGreen' : 'text-appRed')}`}>{t.status === 'Closed' ? formatMoney(t.pat) : '-'}</td>
                        <td class="p-2 border-l border-appBorder bg-white/5 font-semibold text-appAccent">{t.status === 'Closed' ? formatMoney(netReturn) : '-'}</td>
                        
                        {isAdmin && (
                          <td class="p-2 text-center">
                            <div class="flex items-center justify-center space-x-2">
                              <button onClick={() => handleEdit(t)} class="text-appAccent hover:text-sky-300 text-[10px] font-medium bg-appAccent/10 px-2 py-1 rounded transition">Edit</button>
                              <button onClick={() => handleDeleteTrade(t)} class="text-appRed hover:text-red-400 text-[10px] font-medium bg-appRed/10 px-2 py-1 rounded transition">Delete</button>
                            </div>
                          </td>
                        )}
                      </tr>
                    );
                  })}
                </tbody>
                <tfoot class="bg-appCard border-t border-appBorder">
                  <tr>
                    <td colSpan={isAdmin ? 7 : 6} class="p-3 text-right text-gray-400 font-medium">Filtered P&L Totals (Inc. Intra):</td>
                    <td colSpan="2" class="p-3 text-appGreen font-bold text-sm border-l border-appBorder bg-white/5">{formatMoney(totalActualPnL)}</td>
                    <td class="p-3 text-white font-bold text-sm">{formatMoney(totalPAT)}</td>
                    <td colSpan={isAdmin ? 2 : 1}></td>
                  </tr>
                </tfoot>
              </table>
            </div>
          )}
        </div>
      );
    }

    function DashboardCharts({ trades, traders }) {
      const pnlChartRef = useRef(null); const typeChartRef = useRef(null);
      useEffect(() => {
        Chart.defaults.color = '#9CA3AF'; Chart.defaults.borderColor = '#2A364F';
        const closedTrades = trades.filter(t => t.status === 'Closed').sort((a, b) => new Date(a.sellDate) - new Date(b.sellDate));
        const pnlLabels = closedTrades.map(t => t.symbol); 
        const pnlData = closedTrades.map(t => (t.actualPnL || 0) + (t.intradayGains || 0)); 
        const pnlColors = pnlData.map(val => val >= 0 ? '#10B981' : '#EF4444'); 
        let intradayCount = 0; let deliveryCount = 0; closedTrades.forEach(t => { if (t.isIntraday) intradayCount++; else deliveryCount++; });

        const pnlChart = new Chart(pnlChartRef.current, { type: 'bar', data: { labels: pnlLabels, datasets: [{ data: pnlData, backgroundColor: pnlColors, borderRadius: 4 }] }, options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } } });
        const typeChart = new Chart(typeChartRef.current, { type: 'doughnut', data: { labels: ['Intraday', 'Delivery'], datasets: [{ data: [intradayCount, deliveryCount], backgroundColor: ['#38BDF8', '#6366F1'], borderWidth: 0 }] }, options: { responsive: true, maintainAspectRatio: false, cutout: '70%' } });

        return () => { pnlChart.destroy(); typeChart.destroy(); };
      }, [trades, traders]);

      return (
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mt-8 animate-fade-in">
          <div class="bg-appNavy border border-appBorder rounded-xl p-5 lg:col-span-2 h-72 flex flex-col"><h3 class="text-white font-medium mb-4">Trade P&L History</h3><div class="relative flex-1 min-h-0"><canvas ref={pnlChartRef}></canvas></div></div>
          <div class="bg-appNavy border border-appBorder rounded-xl p-5 h-72 flex flex-col lg:col-span-1"><h3 class="text-white font-medium mb-2">Intraday vs Delivery</h3><div class="relative flex-1 min-h-0"><canvas ref={typeChartRef}></canvas></div></div>
        </div>
      );
    }

    function App() {
      const ADMIN_PIN = "1234"; 
      const [isAdmin, setIsAdmin] = useState(false);
      const [currentView, setCurrentView] = useState('dashboard'); 
      const [showArchivedDashboard, setShowArchivedDashboard] = useState(false);
      
      const defaultTraders = [
        { id: 1, name: 'Anil', active: true }, 
        { id: 2, name: 'Kota', active: true }, 
        { id: 3, name: 'Santosh', active: true }, 
        { id: 4, name: 'Anirudha', active: true }
      ];
      
      const [traders, setTradersState] = useState([]);
      const [cashLedger, setCashLedgerState] = useState([]);
      const [trades, setTradesState] = useState([]);

      useEffect(() => {
        if (!db) return;
        const tRef = db.ref('traders'); const cRef = db.ref('cashLedger'); const trRef = db.ref('trades');
        
        tRef.on('value', snap => {
          const data = snap.val();
          if (data) setTradersState(data);
          else tRef.set(defaultTraders); 
        });
        cRef.on('value', snap => setCashLedgerState(snap.val() || []));
        trRef.on('value', snap => setTradesState(snap.val() || []));

        return () => { tRef.off(); cRef.off(); trRef.off(); };
      }, []);

      const setTraders = (data) => { if (db) db.ref('traders').set(data); };
      const setCashLedger = (data) => { if (db) db.ref('cashLedger').set(data); };
      const setTrades = (data) => { if (db) db.ref('trades').set(data); };

      const toggleAdmin = () => {
        if (isAdmin) setIsAdmin(false);
        else {
          const pin = prompt("Enter the Admin PIN to unlock editing:");
          if (pin === ADMIN_PIN) setIsAdmin(true);
          else if (pin !== null) alert("Incorrect PIN!");
        }
      };

      const handleExportData = () => {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({ traders, cashLedger, trades }));
        const a = document.createElement('a'); a.setAttribute("href", dataStr); a.setAttribute("download", `MarketMaga_Backup_${new Date().toISOString().split('T')[0]}.json`);
        document.body.appendChild(a); a.click(); a.remove();
      };
      
      const backupInputRef = useRef(null);
      const handleImportData = (e) => {
        const file = e.target.files[0]; if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const data = JSON.parse(event.target.result);
            if(data.traders && data.cashLedger && data.trades) {
              setTraders(data.traders); setCashLedger(data.cashLedger); setTrades(data.trades);
              alert("Backup successfully restored to Cloud!");
            } else alert("Invalid backup file.");
          } catch(err) { alert("Error reading file."); }
        };
        reader.readAsText(file); e.target.value = '';
      };

      let traderStats = {};
      traders.forEach(t => traderStats[t.id] = { name: t.name, active: t.active !== false, netInvested: 0, amountDeployed: 0, totalPnL: 0, cashHolding: 0, openTradesCount: 0 });

      cashLedger.forEach(entry => {
        if (entry.purpose === 'New Investment') {
          if (traderStats[entry.toMemberId]) traderStats[entry.toMemberId].cashHolding += entry.amount;
          if (traderStats[entry.fromMemberId]) traderStats[entry.fromMemberId].netInvested += entry.amount;
        } else if (entry.purpose === 'Withdrawal') {
          if (traderStats[entry.fromMemberId]) { traderStats[entry.fromMemberId].cashHolding -= entry.amount; traderStats[entry.fromMemberId].netInvested -= entry.amount; }
        } else {
          if (traderStats[entry.fromMemberId]) traderStats[entry.fromMemberId].cashHolding -= entry.amount;
          if (traderStats[entry.toMemberId]) traderStats[entry.toMemberId].cashHolding += entry.amount;
        }
      });

      trades.forEach(trade => {
        if (trade.status === 'Closed') {
          if (traderStats[trade.traderId]) {
            traderStats[trade.traderId].totalPnL += (trade.actualPnL + (trade.intradayGains || 0));
            let returned = (trade.buyPrice * trade.qty) + trade.pat - 15.34;
            traderStats[trade.traderId].cashHolding -= (trade.buyPrice * trade.qty);
            traderStats[trade.traderId].cashHolding += returned;
          }
        } else {
          if (traderStats[trade.traderId]) {
            traderStats[trade.traderId].openTradesCount += 1;
            traderStats[trade.traderId].amountDeployed += (trade.buyPrice * trade.qty);
            traderStats[trade.traderId].cashHolding -= (trade.buyPrice * trade.qty);
          }
        }
      });

      const totalCapitalInFund = Object.values(traderStats).reduce((sum, t) => sum + t.cashHolding + t.amountDeployed, 0);
      const cashAvailableToTrade = Object.values(traderStats).reduce((sum, t) => sum + t.cashHolding, 0);
      const amountDeployed = Object.values(traderStats).reduce((sum, t) => sum + t.amountDeployed, 0);

      const [newTraderName, setNewTraderName] = useState(''); const [editingTraderId, setEditingTraderId] = useState(null); const [editTraderName, setEditTraderName] = useState('');     
      const handleAddTrader = () => { if (newTraderName.trim() === '') return; setTraders([...traders, { id: Date.now(), name: newTraderName.trim(), active: true }]); setNewTraderName(''); };
      
      const isTraderSettleable = (traderId) => {
        const stats = traderStats[traderId];
        return stats && Math.abs(stats.cashHolding) < 1 && stats.amountDeployed === 0;
      };

      const handleQuickSettlePayout = (traderId) => {
        const stats = traderStats[traderId];
        if (window.confirm(`Record a Withdrawal of ${formatMoney(stats.cashHolding)} dated today for ${stats.name}, covering their full remaining balance (principal + realized profit)? This will bring their cash balance to ₹0.`)) {
          const newEntry = {
            id: Date.now(),
            date: new Date().toISOString().split('T')[0],
            amount: parseFloat(stats.cashHolding.toFixed(2)),
            fromMemberId: traderId,
            toMemberId: traderId,
            purpose: 'Withdrawal',
            comments: 'Final settlement payout (auto-recorded)',
            linkedTradeIds: []
          };
          setCashLedger([...cashLedger, newEntry].sort((a, b) => new Date(b.date) - new Date(a.date)));
        }
      };

      const handleArchiveTrader = (traderId) => {
        if (window.confirm('Archive this trader? Their full trade/ledger history is preserved and stays visible everywhere, they just stop appearing as an option for new trades/entries. You can reactivate them later.')) {
          setTraders(traders.map(t => t.id === traderId ? { ...t, active: false, archivedAt: new Date().toISOString().split('T')[0] } : t));
        }
      };

      const handleReactivateTrader = (traderId) => {
        setTraders(traders.map(t => t.id === traderId ? { ...t, active: true, archivedAt: null } : t));
      };

      const startEditingTrader = (t) => { setEditingTraderId(t.id); setEditTraderName(t.name); };
      const saveEditTrader = () => { setTraders(traders.map(t => t.id === editingTraderId ? { ...t, name: editTraderName.trim() } : t)); setEditingTraderId(null); };
      
      const getButtonClass = (viewName) => `px-4 py-2 rounded-lg text-sm font-medium transition-all duration-200 ${currentView === viewName ? 'bg-appAccent/10 text-appAccent' : 'text-gray-400 hover:text-gray-200 hover:bg-gray-800/50'}`;

      if (!db) return <div class="flex items-center justify-center h-screen bg-appNavy text-gray-400">Loading Cloud Database or Missing Config...</div>;

      const activeTraders = traders.filter(t => t.active !== false);
      const archivedTraders = traders.filter(t => t.active === false);

      return (
        <div class="min-h-screen flex flex-col">
          <nav class="bg-appNavy border-b border-appBorder sticky top-0 z-10">
            <div class="max-w-7xl mx-auto px-6 h-20 flex justify-between items-center">
              <div class="text-2xl font-bold tracking-tight text-white uppercase">Market <span class="text-appAccent">Maga</span></div>
              <div class="flex items-center space-x-4">
                <div class="flex space-x-2">
                  <button onClick={() => setCurrentView('dashboard')} class={getButtonClass('dashboard')}>Dashboard</button>
                  <button onClick={() => setCurrentView('tradelog')} class={getButtonClass('tradelog')}>Trade Log</button>
                  <button onClick={() => setCurrentView('ledger')} class={getButtonClass('ledger')}>Cash Ledger</button>
                  <button onClick={() => setCurrentView('statements')} class={getButtonClass('statements')}>Monthly Statements</button>
                  <button onClick={() => setCurrentView('profitshare')} class={getButtonClass('profitshare')}>Profit Share</button>
                  <button onClick={() => setCurrentView('traders')} class={getButtonClass('traders')}>Manage Traders</button>
                </div>
                <button onClick={toggleAdmin} class={`ml-4 px-3 py-1.5 rounded-lg text-xs font-bold transition-all ${isAdmin ? 'bg-appGreen/20 text-appGreen border border-appGreen/30' : 'bg-gray-800/80 text-gray-400 border border-gray-700'}`}>
                  {isAdmin ? '🔓 ADMIN UNLOCKED' : '🔒 READ ONLY'}
                </button>
              </div>
            </div>
          </nav>

          <main class="flex-grow p-6 md:p-10 max-w-7xl mx-auto w-full">
            <div class="bg-appCard border border-appBorder rounded-2xl shadow-xl p-8 min-h-[500px]">
              
              {currentView === 'dashboard' && (
                <div class="animate-fade-in">
                  <div class="flex justify-between items-end mb-6">
                    <h1 class="text-2xl font-semibold text-white">Fund Overview</h1>
                    <div class="space-x-3">
                      {isAdmin && <input type="file" accept=".json" ref={backupInputRef} onChange={handleImportData} class="hidden" />}
                      {isAdmin && <button onClick={() => backupInputRef.current.click()} class="bg-appAccent/10 text-appAccent border border-appAccent/30 font-semibold px-4 py-2 rounded-lg hover:bg-appAccent/20 transition">↑ Restore Backup</button>}
                      <button onClick={handleExportData} class="bg-appAccent/10 text-appAccent border border-appAccent/30 font-semibold px-4 py-2 rounded-lg hover:bg-appAccent/20 transition">↓ Download Backup Data</button>
                    </div>
                  </div>
                  
                  <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                    <div class="bg-appNavy border border-appBorder rounded-xl p-6"><p class="text-gray-400 text-sm font-medium mb-1">Total Fund Value</p><p class="text-3xl font-bold text-white">{formatMoney(totalCapitalInFund)}</p></div>
                    <div class="bg-appNavy border border-appBorder rounded-xl p-6"><p class="text-gray-400 text-sm font-medium mb-1">Total Cash Available</p><p class="text-3xl font-bold text-appAccent">{formatMoney(cashAvailableToTrade)}</p></div>
                    <div class="bg-appNavy border border-appBorder rounded-xl p-6"><p class="text-gray-400 text-sm font-medium mb-1">Total Deployed (Open)</p><p class="text-3xl font-bold text-gray-300">{formatMoney(amountDeployed)}</p></div>
                  </div>

                  <div class="bg-appNavy border border-appBorder rounded-xl overflow-hidden mb-8">
                    <div class="p-4 bg-appCard border-b border-appBorder flex justify-between items-center">
                      <h3 class="text-white font-medium">Current Trader Status</h3>
                      <span class="text-xs text-gray-400">Live snapshot of who holds what right now</span>
                    </div>
                    <div class="overflow-x-auto">
                      <table class="w-full text-left text-sm whitespace-nowrap">
                        <thead class="bg-appNavy border-b border-appBorder text-gray-400 text-xs uppercase">
                          <tr><th class="px-5 py-3">Trader Name</th><th class="px-5 py-3">Total Net Invested</th><th class="px-5 py-3 text-appRed">Amount Spent (Deployed)</th><th class="px-5 py-3">All-Time P&L (Inc. Intra)</th><th class="px-5 py-3 text-appAccent font-bold border-l border-appBorder bg-white/5">Current Cash Holding</th></tr>
                        </thead>
                        <tbody class="divide-y divide-appBorder">
                          {activeTraders.map(t => {
                            const stats = traderStats[t.id];
                            return (
                              <tr key={t.id} class="hover:bg-white/5 transition">
                                <td class="px-5 py-3 font-medium text-white">{stats.name}</td>
                                <td class="px-5 py-3 text-gray-300">{formatMoney(stats.netInvested)}</td>
                                <td class="px-5 py-3 text-appRed">{formatMoney(stats.amountDeployed)}</td>
                                <td class={`px-5 py-3 font-medium ${stats.totalPnL >= 0 ? 'text-appGreen' : 'text-appRed'}`}>{stats.totalPnL >= 0 ? '+' : ''}{formatMoney(stats.totalPnL)}</td>
                                <td class="px-5 py-3 text-appAccent font-bold border-l border-appBorder bg-white/5">{formatMoney(stats.cashHolding)}</td>
                              </tr>
                            );
                          })}
                          
                          {showArchivedDashboard && archivedTraders.map(t => {
                            const stats = traderStats[t.id];
                            return (
                              <tr key={t.id} class="hover:bg-white/5 transition bg-appNavy/50">
                                <td class="px-5 py-3 font-medium text-gray-500">{stats.name} <span class="text-[10px] ml-1 bg-gray-800 px-1 rounded">Archived</span></td>
                                <td class="px-5 py-3 text-gray-600">{formatMoney(stats.netInvested)}</td>
                                <td class="px-5 py-3 text-gray-600">{formatMoney(stats.amountDeployed)}</td>
                                <td class="px-5 py-3 text-gray-600">{stats.totalPnL >= 0 ? '+' : ''}{formatMoney(stats.totalPnL)}</td>
                                <td class="px-5 py-3 text-gray-500 border-l border-appBorder">{formatMoney(stats.cashHolding)}</td>
                              </tr>
                            );
                          })}
                        </tbody>
                      </table>
                    </div>
                    {archivedTraders.length > 0 && (
                      <div class="p-3 bg-appNavy text-center border-t border-appBorder">
                        <button onClick={() => setShowArchivedDashboard(!showArchivedDashboard)} class="text-xs text-gray-500 hover:text-gray-300">
                          {showArchivedDashboard ? 'Hide archived traders' : `Show ${archivedTraders.length} archived trader(s)`}
                        </button>
                      </div>
                    )}
                  </div>

                  <LiveOpenTradesTracker trades={trades} traders={traders} />
                  <DashboardCharts trades={trades} traders={traders} />
                </div>
              )}
              
              {currentView === 'tradelog' && <TradeLogView trades={trades} setTrades={setTrades} traders={traders} setTraders={setTraders} cashLedger={cashLedger} setCashLedger={setCashLedger} isAdmin={isAdmin} />}
              {currentView === 'ledger' && <CashLedgerView cashLedger={cashLedger} setCashLedger={setCashLedger} traders={traders} setTraders={setTraders} trades={trades} isAdmin={isAdmin} />}
              {currentView === 'statements' && <MonthlyStatementView cashLedger={cashLedger} trades={trades} traders={traders} />}
              {currentView === 'profitshare' && <ProfitShareView cashLedger={cashLedger} trades={trades} traders={traders} traderStats={traderStats} />}
              
              {currentView === 'traders' && ( 
                <div class="animate-fade-in">
                  <h1 class="text-2xl font-semibold text-white mb-6">Manage Traders</h1>
                  {isAdmin && (
                    <div class="flex items-center space-x-4 mb-8">
                      <input type="text" placeholder="Enter new trader name..." value={newTraderName} onChange={(e) => setNewTraderName(e.target.value)} class="bg-appNavy border border-appBorder text-white rounded-lg px-4 py-2 focus:outline-none focus:border-appAccent w-64" />
                      <button onClick={handleAddTrader} class="bg-appAccent text-appNavy font-semibold px-4 py-2 rounded-lg hover:bg-sky-400 transition">+ Add Trader</button>
                    </div>
                  )}

                  <div class="space-y-6 max-w-4xl">
                    <div class="bg-appNavy border border-appBorder rounded-xl overflow-hidden shadow-sm">
                      <div class="p-4 bg-appCard border-b border-appBorder"><h3 class="text-white font-medium">Active Traders</h3></div>
                      <ul class="divide-y divide-appBorder">
                        {activeTraders.map((trader) => {
                          const stats = traderStats[trader.id];
                          const isSettleable = isTraderSettleable(trader.id);
                          const nonZeroHolding = Math.abs(stats.cashHolding) >= 1;

                          return (
                            <li key={trader.id} class="flex items-center justify-between p-4 hover:bg-white/5 transition">
                              <div class="flex items-center space-x-4">
                                {editingTraderId === trader.id ? ( 
                                  <input type="text" value={editTraderName} onChange={(e) => setEditTraderName(e.target.value)} class="bg-appCard border border-appAccent text-white rounded px-2 py-1 focus:outline-none" /> 
                                ) : ( 
                                  <span class="text-white font-semibold min-w-[120px]">{trader.name}</span> 
                                )}
                                
                                <span class="text-gray-400 text-sm border-l border-appBorder pl-4">{formatMoney(stats.cashHolding)} holding</span>
                                
                                {isSettleable ? (
                                  <span class="px-2 py-1 rounded-full text-xs font-semibold bg-appGreen/10 text-appGreen border border-appGreen/30">✅ Ready to Settle</span>
                                ) : (
                                  <span class="px-2 py-1 rounded-full text-xs bg-gray-800 text-gray-300 border border-gray-700">
                                    Active · {nonZeroHolding ? `${formatMoney(stats.cashHolding)} cash ` : ''}
                                    {nonZeroHolding && stats.openTradesCount > 0 ? '+ ' : ''}
                                    {stats.openTradesCount > 0 ? `${stats.openTradesCount} open position(s)` : ''}
                                  </span>
                                )}
                              </div>
                              
                              {isAdmin && (
                                <div class="flex items-center space-x-3">
                                  {nonZeroHolding && stats.amountDeployed === 0 && (
                                    <button onClick={() => handleQuickSettlePayout(trader.id)} class="text-appAccent text-xs bg-appAccent/10 px-3 py-1.5 rounded border border-appAccent/30 hover:bg-appAccent/20 transition">
                                      Record Final Payout ({formatMoney(stats.cashHolding)})
                                    </button>
                                  )}
                                  
                                  {editingTraderId === trader.id ? ( 
                                    <button onClick={saveEditTrader} class="text-appGreen hover:text-green-400 text-sm font-medium">Save</button> 
                                  ) : ( 
                                    <button onClick={() => startEditingTrader(trader)} class="text-gray-400 hover:text-white text-sm font-medium">Edit</button> 
                                  )}
                                  
                                  <button 
                                    onClick={() => handleArchiveTrader(trader.id)} 
                                    disabled={!isSettleable} 
                                    title={!isSettleable ? `Still holds ${formatMoney(stats.cashHolding)} or has open positions — clear balance first.` : ''}
                                    class={`text-sm font-medium px-2 py-1 rounded ${isSettleable ? 'text-appRed hover:bg-appRed/10 transition cursor-pointer' : 'text-gray-600 cursor-not-allowed'}`}
                                  >
                                    Settle & Remove
                                  </button>
                                </div>
                              )}
                            </li>
                          );
                        })}
                      </ul>
                    </div>

                    {archivedTraders.length > 0 && (
                      <div class="bg-appNavy border border-appBorder rounded-xl overflow-hidden shadow-sm opacity-80">
                        <div class="p-4 bg-appCard border-b border-appBorder"><h3 class="text-gray-400 font-medium">Archived / Settled Traders</h3></div>
                        <ul class="divide-y divide-appBorder">
                          {archivedTraders.map((trader) => (
                            <li key={trader.id} class="flex items-center justify-between p-4 hover:bg-white/5 transition">
                              <div class="flex items-center space-x-4">
                                {editingTraderId === trader.id ? ( 
                                  <input type="text" value={editTraderName} onChange={(e) => setEditTraderName(e.target.value)} class="bg-appCard border border-appAccent text-white rounded px-2 py-1 focus:outline-none" /> 
                                ) : ( 
                                  <span class="text-gray-400 font-medium min-w-[120px]">{trader.name}</span> 
                                )}
                                <span class="text-gray-500 text-xs border-l border-appBorder pl-4">Archived on {trader.archivedAt || 'Unknown'}</span>
                              </div>
                              {isAdmin && (
                                <div class="flex items-center space-x-3">
                                  {editingTraderId === trader.id ? ( 
                                    <button onClick={saveEditTrader} class="text-appGreen hover:text-green-400 text-sm font-medium">Save</button> 
                                  ) : ( 
                                    <button onClick={() => startEditingTrader(trader)} class="text-gray-500 hover:text-white text-sm font-medium">Edit</button> 
                                  )}
                                  <button onClick={() => handleReactivateTrader(trader.id)} class="text-appAccent hover:text-sky-300 text-sm font-medium bg-appAccent/10 px-3 py-1 rounded">Reactivate</button>
                                </div>
                              )}
                            </li>
                          ))}
                        </ul>
                      </div>
                    )}
                  </div>
                </div> 
              )}
            </div>
          </main>
        </div>
      );
    }
    const root = ReactDOM.createRoot(document.getElementById('root')); root.render(<App />);
  </script>
  <style>@keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } } .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }</style>
</body>
</html>
